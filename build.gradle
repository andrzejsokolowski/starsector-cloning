plugins { id 'java' }

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

sourceSets.main.java.srcDirs = ['src']

dependencies {
    compileOnly fileTree(dir: "${starsectorPath}/starsector-core", include: '*.jar')
    compileOnly fileTree(dir: "${starsectorPath}/mods/LunaLib-2.0.5/jars", include: '*.jar')
    compileOnly fileTree(dir: "${starsectorPath}/mods/LazyLib-3.0.0/jars", include: '*.jar')
}


jar {
    destinationDirectory = file('jars')
    archiveFileName = 'cloning.jar'
}

// Release packaging: stage the runtime files in Cloning/ and zip that folder as cloning.zip
// (the asset name directDownloadURL expects). Both outputs are gitignored.
def stagingName = 'Cloning'

tasks.register('stageRelease', Sync) {
    dependsOn tasks.named('jar')
    into file(stagingName)
    from('.') { include 'mod_info.json', 'cloning.version', 'icon.png' }
    from('data') { into 'data' }
    from('graphics') { into 'graphics' }
    from('jars') { into 'jars'; include 'cloning.jar' }
}

tasks.register('releaseZip', Zip) {
    dependsOn tasks.named('stageRelease')
    from(file(stagingName)) { into stagingName }
    destinationDirectory = layout.projectDirectory
    archiveFileName = 'cloning.zip'
}
